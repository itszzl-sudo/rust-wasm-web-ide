    <script>
      (function() {
        var base = window.location.hostname.includes('github.io') 
          ? '/rust-wasm-web-ide/' 
          : '/';
        self.MonacoEnvironment = {
          getWorker: function(_, label) {
            var workerPath = label === 'typescript' || label === 'javascript'
              ? base + 'ts.worker.js'
              : base + 'editor.worker.js';
            return new Worker(workerPath, { type: 'classic' });
          }
        };
      })();
    </script>
