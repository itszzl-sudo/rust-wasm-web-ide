[package]
name = "rust-analyzer-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
ra_syntax = { path = "../mock_rust_analyzer/ra_syntax" }
ra_ide = { path = "../mock_rust_analyzer/ra_ide" }

[profile.release]
opt-level = "s"
lto = true
